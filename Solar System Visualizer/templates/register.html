<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Solar System Visualizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="stars"></div>
        
        <div class="auth-box">
            <div class="auth-header">
                <i class="fas fa-globe"></i>
                <h1>Solar System Visualizer</h1>
                <p>Create Your Account</p>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose your username" required>
                    <span class="error" id="usernameError"></span>
                    <span class="info">3-20 characters, letters and numbers only</span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    <span class="error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                    <span class="error" id="passwordError"></span>
                    <span class="info">At least 8 characters</span>
                    <div class="password-strength">
                        <div class="strength-bar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cpassword">Confirm Password</label>
                    <input type="password" id="cpassword" name="cpassword" placeholder="Confirm your password" required>
                    <span class="error" id="cpasswordError"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span>I agree to the <a href="#">Terms & Conditions</a></span>
                    </label>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>

                <div id="formMessage" class="form-message"></div>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login">Sign In</a></p>
            </div>

            <div class="back-home">
                <a href="/" class="back-link">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script>
        // Password strength indicator
        document.getElementById('password').addEventListener('input', function() {
            updatePasswordStrength(this.value);
        });

        function updatePasswordStrength(password) {
            const strengthBar = document.querySelector('.strength-bar');
            let strength = 0;

            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            const widths = ['0%', '20%', '40%', '60%', '80%', '100%'];
            const colors = ['#ff4444', '#ff8844', '#ffbb44', '#bbdd44', '#44dd44'];
            
            strengthBar.style.width = widths[strength];
            strengthBar.style.backgroundColor = colors[strength - 1] || '#ff4444';
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            handleRegister();
        });

        function handleRegister() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const cpassword = document.getElementById('cpassword').value;
            const terms = document.getElementById('terms').checked;
            const messageDiv = document.getElementById('formMessage');

            // Clear previous messages
            messageDiv.textContent = '';
            document.querySelectorAll('.error').forEach(el => el.textContent = '');

            let hasError = false;

            // Validation
            if (username.length < 3 || username.length > 20) {
                document.getElementById('usernameError').textContent = 'Username must be 3-20 characters';
                hasError = true;
            }

            if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                document.getElementById('usernameError').textContent = 'Username can only contain letters, numbers, and underscores';
                hasError = true;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                document.getElementById('emailError').textContent = 'Please enter a valid email';
                hasError = true;
            }

            if (password.length < 8) {
                document.getElementById('passwordError').textContent = 'Password must be at least 8 characters';
                hasError = true;
            }

            if (password !== cpassword) {
                document.getElementById('cpasswordError').textContent = 'Passwords do not match';
                hasError = true;
            }

            if (!terms) {
                messageDiv.className = 'form-message error';
                messageDiv.textContent = 'You must agree to the terms and conditions';
                hasError = true;
            }

            if (hasError) return;

            // Show loading state
            const submitBtn = document.querySelector('.btn-submit');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

            fetch('/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, email, password })
            })
            .then(response => {
                if (response.ok) {
                    messageDiv.className = 'form-message success';
                    messageDiv.textContent = 'Registration successful! Redirecting to login...';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    return response.json().then(data => {
                        throw new Error(data.message || 'Registration failed');
                    });
                }
            })
            .catch(error => {
                messageDiv.className = 'form-message error';
                messageDiv.textContent = error.message;
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            });
        }
    </script>
</body>
</html>
