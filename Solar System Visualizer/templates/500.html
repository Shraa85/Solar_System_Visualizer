<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #050b18 0%, #02050c 100%);
            color: white;
        }
        .card {
            text-align: center;
            padding: 32px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            width: min(500px, 90%);
        }
        a {
            display: inline-block;
            margin-top: 18px;
            text-decoration: none;
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            background: #1f6fff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>500 - Internal Server Error</h1>
        <p>Something went wrong on the server.</p>
        <a href="/">Go Back Home</a>
    </div>
</body>
</html>
